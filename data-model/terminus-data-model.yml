api: Verify API
entities:
- name: SingleEmailValidation
  description: The synchronous result of validating one email address.
  operation: 'POST /api/singleEmail/validate?email={email}'
  fields:
  - {name: email, type: string, description: The original email address submitted.}
  - {name: result, type: string, enum_ref: Result, description: High-level validation outcome.}
  - {name: resultDetail, type: string, enum_ref: ResultDetail, description: Specific explanation of why the result was returned.}
  - {name: corrected, type: boolean, description: Whether the email was auto-corrected.}
  - {name: verifiedEmail, type: string, description: The validated (or corrected) email address.}
  - {name: domain, type: string, description: The domain part of the email.}
  - {name: localPart, type: string, description: The portion before the '@'.}
- name: BatchUpload
  description: The acknowledgement returned when a CSV of addresses is submitted for batch verification.
  operation: 'POST /api/batch/validation (multipart form field `file`)'
  fields:
  - {name: fileName, type: string}
  - {name: fileSize, type: integer, description: Bytes.}
  - {name: fileContentType, type: string, example: text/csv}
  - {name: fileId, type: integer, description: Numeric identifier of the stored file.}
  - {name: meta, type: object, ref: BatchUploadMeta}
- name: BatchUploadMeta
  description: Pre-processing summary metrics computed at upload time.
  fields:
  - {name: batchJobId, type: string, format: uuid, description: 'The durable job identifier used to poll status and download results.'}
  - {name: emailCount, type: integer}
  - {name: duplicateCount, type: integer}
  - {name: spamtrapCount, type: integer}
  - {name: disposableCount, type: integer}
  - {name: roleAccountCount, type: integer}
  - {name: invalidFormatCount, type: integer}
  - {name: typoCount, type: integer}
- name: BatchJobStatus
  description: The progress and outcome breakdown of a batch verification job.
  operation: 'POST /api/batch/{jobId}/status'
  fields:
  - {name: jobId, type: string, format: uuid}
  - {name: countDetail, type: object, ref: BatchCountDetail}
  - {name: totalEmail, type: integer}
  - {name: totalProcessedEmail, type: integer}
  - {name: status, type: string, enum: [IN_PROGRESS, COMPLETED]}
  - {name: createDate, type: string, format: date-time}
  - {name: completeDate, type: string, format: date-time}
  - {name: processedTime, type: integer, description: Seconds taken to complete.}
  - {name: processed, type: integer, description: Percent complete.}
- name: BatchCountDetail
  description: Per-result-class tally for a completed or in-flight batch job.
  fields:
  - {name: validCount, type: integer}
  - {name: invalidCount, type: integer}
  - {name: acceptAllCount, type: integer}
  - {name: riskyCount, type: integer}
  - {name: duplicateCount, type: integer}
  - {name: unknownCount, type: integer}
- name: ResultsFile
  description: The CSV of per-address results for a completed batch job.
  operation: 'GET /api/file/download/{jobId}'
  media_type: text/csv
  columns:
  - {name: Email, description: The original email submitted for verification.}
  - {name: Verified Email, description: The verified or corrected version of the original email.}
  - {name: Corrected, description: 'Flag indicating whether the email was corrected (TRUE/FALSE).'}
  - {name: Result, description: 'The verification result — same vocabulary as SingleEmailValidation.result.'}
  - {name: Additional Status Info, description: 'The result detail — same vocabulary as SingleEmailValidation.resultDetail.'}
- name: ErrorResponse
  description: The vendor error envelope.
  ref: errors/terminus-problem-types.yml
  fields: [httpStatus, code, timeStamp, codeName, exceptionName, message]
relationships:
- {from: BatchUpload, to: BatchUploadMeta, type: has_one, via: meta}
