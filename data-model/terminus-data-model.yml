- {from: ResultsFile, to: SingleEmailValidation, type: has_many, via: 'one CSV row per submitted address, carrying the same Result/Additional Status Info vocabulary'}
identifiers:
- {name: batchJobId, format: uuid, prefix: none, scope: 'batch verification job; the primary correlation id across submit, poll and download'}
- {name: fileId, format: integer, prefix: none, scope: 'the stored upload; not used by any documented downstream call'}
enums:
  Result:
    source: https://support.demandscience.com/hc/en-us/articles/38485945587091-Download-Results
    values:
    - {value: VALID, description: Email is valid.}
    - {value: INVALID, description: Email is invalid.}
    - {value: UNKNOWN, description: Unable to determine results.}
    - {value: RISKY, description: Email is risky.}
    - {value: DUPLICATE, description: Duplicate email detected.}
    - {value: ACCEPT_ALL, description: Email is accept-all.}
    - {value: ACCEPT_ALL/KNOWN_USER, description: Reliable determination the email address has an Office 365 account.}
    - {value: ACCEPT_ALL/UNKNOWN_USER, description: Reliable determination the email address does not have an Office 365 account.}
  ResultDetail:
    source: https://support.demandscience.com/hc/en-us/articles/38485945587091-Download-Results
    values:
    - {value: OK, description: Email address is valid — deliverable email address.}
    - {value: ANY_EMAIL_ACCEPTED, description: Email server is accepting any emails for the domain.}
    - {value: B2C, description: 'Email address is B2C — from a free provider such as hotmail, yahoo, gmail.'}
    - {value: BAD, description: Email address is bad.}
    - {value: COMMON_TYPO, description: Email address contains a typo.}
    - {value: DISPOSABLE, description: 'Email address is disposable — typically quick-turnaround addresses that are disposed of quickly.'}
    - {value: DNS_FAILURE, description: DNS lookup of the email domain results in a failure.}
    - {value: DOMAIN_SUSPENDED, description: Email domain is suspended.}
    - {value: DUPLICATE, description: Email address is duplicate.}
    - {value: EXCLUDE, description: Email address is excluded.}
    - {value: GREYLISTING, description: Email address is greylisted.}
    - {value: INVALID_CONVERSATION, description: Target mail server returned an invalid conversation.}
    - {value: INVALID_FORMAT, description: Email address format is invalid.}
    - {value: KNOWN_ACCEPT_ALL, description: Email address is a known accept-all.}
    - {value: KNOWN_NOT_ACCEPT_ALL, description: Email address is a known not-accept-all.}
    - {value: MAILBOX_FULL, description: 'Destination inbox was full and therefore rejecting messages.'}
    - {value: ROLE_ACCOUNT, description: 'Email address is a role account, for example info@, webmaster@, postmaster@.'}
    - {value: SERVER_CONFIG_ERROR, description: Target mail server has configuration issues.}
    - {value: SPAM_TRAP, description: Email address is a known or suspected spam trap.}
    - {value: TIMES_OUT, description: Email address processing timed out — may need reprocessing.}
    - {value: UNABLE_TO_CONNECT, description: Unable to connect to the target mail server.}
    - {value: UNKNOWN, description: Unable to distinguish specific results.}
    - {value: MAILBOX_NOT_FOUND, description: 'Named in the single-email article as an example resultDetail; not repeated in the code table.'}
    - {value: DOMAIN_INVALID, description: 'Named in the single-email article as an example resultDetail; not repeated in the code table.'}
    note: >-
      The provider publishes the code table across three separate tables in one
      article; MAILBOX_NOT_FOUND and DOMAIN_INVALID appear only as inline examples in
      the "Verify Single and Batch Uploads" article and are flagged as such rather
      than dropped.
