note: >-
  Every package below was published from the Terminus first-party GitHub
  organization github.com/GetTerminus ("Terminus Account Based Marketing") under the
  npm @terminus scope, so official: true is accurate on the publisher axis. NONE OF
  THEM IS AN API CLIENT. They are the Angular design system, design tokens and lint
  configurations Terminus used to build its own front end — there is no first-party
  SDK for the Terminus ABM Platform API, the Employee Automation API or the Verify
  API in any registry (npm, PyPI, RubyGems, Maven Central, NuGet, crates.io,
  pkg.go.dev, Packagist). For that reason NO `SDKs` pointer is wired in apis.yml;
  wiring one would credit Terminus with a client library it never shipped.
  CURRENCY: the newest release in the whole scope is 2021-01-20. The @terminus scope
  has been dormant for five years, which straddles the 2024-11-12 DemandScience
  merger — the packages predate the merger and were not carried forward under
  DemandScience branding.
