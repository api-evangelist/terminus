- id: batch-upload-standard-max
  api: Verify API
  scope: per-request
  kind: payload-size
  limit: 10485760
  unit: bytes
  rule: 'Files 10MB or smaller use the standard multipart upload to /api/batch/validation; files larger than 10MB must use the generateUploadUrl method.'
  source: https://support.demandscience.com/hc/en-us/articles/38485762247059-Verify-Single-and-Batch-Uploads
- id: batch-recommended-max
  api: Verify API
  scope: per-request
  kind: recommendation
  limit: 1000000
  unit: records
  rule: 'No hard file size limit — "We have no file size limit for our batch upload methods" — but the provider recommends a maximum of 1m records, approximately a 20MB file, for optimal performance.'
  source: https://support.demandscience.com/hc/en-us/articles/46450196227731-Service-Usage-Credits
- id: batch-status-polling
  api: Verify API
  scope: per-job
  kind: polling-guidance
  rule: 'Poll POST /api/batch/{jobId}/status every 5-10 seconds for small files (under 1,000 records); poll less frequently for larger files to reduce unnecessary requests.'
  enforced: false
  note: 'Stated as guidance "to avoid overloading your system or the API" — no server-side enforcement is described.'
  source: https://support.demandscience.com/hc/en-us/articles/38485850016787-Checking-the-Batch-Job-Status
