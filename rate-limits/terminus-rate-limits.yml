  kind: quota
  unit: credit
  rule: One credit is consumed per email verification.
  window: none
  expiry: 'Credits are valid for the lifetime of the account, or until used up.'
  balance_visibility: 'Shown in the top-right of the Intelligent Verification dashboard; no balance endpoint is documented.'
