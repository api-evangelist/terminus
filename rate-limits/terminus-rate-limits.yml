note: >-
  DemandScience publishes NO request-rate limit for any Terminus / DemandScience
  API — no requests-per-second, no burst, no quota window, and no rate-limit
  response headers. limit_count is therefore 0 and that zero is the finding, not a
  gap in this pass. What the provider does publish is a set of VOLUME and USAGE
  constraints (credits, file sizes, export caps) plus polling guidance, all recorded
  below as `constraints` so they are not mistaken for rate limits. Headers were also
  checked live: an anonymous request to api.lastbounce.com returns no
  X-RateLimit-*, RateLimit-* or Retry-After header.
limit_count: 0
limits: []
headers:
  documented: []
  observed: []
  retry_after: false
  note: >-
    No rate-limit signalling of any kind. The only response headers observed on
    api.lastbounce.com are AWS API Gateway defaults (x-amzn-RequestId,
    x-amz-apigw-id, x-amzn-ErrorType). An agent cannot back off on a runtime signal
    from this API; it must rely on the polling cadence in the docs.
exhaustion:
  status_code: null
  note: >-
    The documented failure mode is credit exhaustion, not rate limiting: "For every
    email verification, a credit is consumed from your account. If you lack
    sufficient credits, the API call will be unsuccessful." The status code and
    response body for that case are not published.
