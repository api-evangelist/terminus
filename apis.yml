aid: terminus
name: Terminus
description: 'Terminus is an account-based marketing (ABM) platform covering account-based
  advertising, web personalization, email-signature marketing (Sigstr), conversational
  chat (Ramble) and revenue measurement (BrightFunnel). Terminus merged into DemandScience
  on 2024-11-12; terminus.com now 301-redirects to demandscience.com and the product
  runs as the DemandScience ABM Platform at app.demandscienceplatform.com. Terminus-branded
  infrastructure is still in production — api.terminusplatform.com, email.terminusplatform.com
  (Email Experiences / Signature Ads), terminus.bound360.com (Web Experiences) and
  *.terminus.services — and the API reference is published on a Redocly developer portal
  at developer.terminus.com. Platform API access is issued through a support ticket,
  and every path on the developer portal and the API host requires credentials. A third
  API is publicly documented: the Verify API (formerly Lastbounce, sold as Intelligent
  Verification) at api.lastbounce.com, whose endpoints, x-api-key header, error envelope
  and result-code vocabulary are all published in the DemandScience Help Center — as
  prose and cURL, with no OpenAPI served anywhere. No plans or price points are
  published, no rate limits are documented, and there is no first-party SDK in any
  registry for any of the three APIs.'
