apis:
- name: Terminus ABM Platform API
  description: 'The account-based marketing platform API behind Terminus (now the DemandScience
    ABM Platform). The API host api.terminusplatform.com is live and answers every
    anonymous request with HTTP 401 "Authentication Invalid"; the reference is published
    on a Redocly developer portal at developer.terminus.com where every path 302-redirects
    to /redocly-login. Platform API access is requested through a support ticket.'
  humanURL: https://developer.terminus.com/
  baseURL: https://api.terminusplatform.com/
  tags:
  - Account Based Marketing
  - Marketing
  properties:
  - type: DeveloperPortal
    url: https://developer.terminus.com/
  - type: Authentication
    url: authentication/terminus-authentication.yml
- name: Employee Automation API
  description: 'A dedicated service that streamlines management of users and employee
    signature data inside an Email Experiences (Signature Ads, formerly Sigstr) account.
    Employee data delivered to the API endpoint creates, updates and removes employees
    in real time; v4 (July 2022) stops Employee Group changes from overwriting admin
    selections made in the UI. Access is granted by submitting a support ticket, and
    no public reference or specification is published.'
  humanURL: https://support.demandscience.com/hc/en-us/articles/360051822454-Employee-Automation-API-for-Email-Experiences
  baseURL: https://email.terminusplatform.com/
  tags:
  - Email
  - Marketing
- name: Verify API
  description: 'Email verification API — single-address real-time validation and asynchronous
    CSV batch verification, sold as Intelligent Verification. OWNERSHIP: this API is
    served from api.lastbounce.com rather than a terminus.com or demandscience.com
    host because Verify is the renamed Lastbounce product; the provider''s own
    reference states the environment URL format is https://<environment>.lastbounce.com/,
    and the article is published in the DemandScience Help Center whose product-rename
    set (Lastbounce → Verify, Klarity → Audience Builder, Email Experiences → Signature
    Ads) is documented in lifecycle/terminus-lifecycle.yml. It is a sibling product to
    the Terminus ABM Platform under the merged DemandScience entity this repo profiles,
    NOT a Terminus-branded API — recorded as its own entry so it is never conflated
    with the ABM Platform API. It is the only API of this provider with a public
    reference: endpoints, the x-api-key header, the error envelope and the full
    result-code vocabulary are all published, though no OpenAPI is served (the article
    offers "a copy of the full API documentation" on request). Operations: POST
    /api/singleEmail/validate, POST /api/batch/validation, POST /api/batch/{jobId}/status,
    GET /api/file/download/{jobId}. Metered in prepaid credits, one per verification.'
  humanURL: https://support.demandscience.com/hc/en-us/sections/38485678357267-API-Documentation
  baseURL: https://api.lastbounce.com/
  tags:
  - Email Verification
  - Data Quality
  - Email
