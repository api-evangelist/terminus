source: https://support.demandscience.com/hc/en-us
note: >-
  UPDATED 2026-08-12: a third API — the Verify API at api.lastbounce.com — was found
  fully documented in the DemandScience Help Center "API Documentation" section.
  It still ships no machine-readable specification, but its error envelope IS now
  publicly observable, so rfc9457-problem-details moves from unknown to a determined
  `false`, and http-status-codes can be asserted true.
  ORIGINAL NOTE:
  Terminus publishes no OpenAPI, AsyncAPI, GraphQL SDL or JSON Schema anywhere that
  is anonymously reachable, so nothing below is derived from a specification. Every
  entry is either a claim made in the public DemandScience Help Center or a fact
  observed by probing the live hosts. Standards that cannot be checked without
  credentials are recorded as conforms: unknown rather than false.
standards:
- id: saml2
  conforms: true
  evidence: >-
    "DemandScience supports the SAML 2.0 authentication framework for additional 3rd
    party SSO providers... both SP-initiated and Identity Provider (IdP) initiated
    SAML integrations."
  source: https://support.demandscience.com/hc/en-us/articles/360059215833-Logging-Into-the-DemandScience-Platform-Using-SAML-2-0
- id: oidc
  conforms: true
  evidence: >-
    Same article offers OpenID Connect as an alternative to SAML, requiring the
    customer's issuer, OAuth 2.0 authorization endpoint, token endpoint, JWKS
    endpoint and userinfo endpoint. This is OIDC as a relying party for user SSO —
    not an OIDC-protected API. No /.well-known/openid-configuration document is
    served by any Terminus or DemandScience host.
  source: https://support.demandscience.com/hc/en-us/articles/360059215833-Logging-Into-the-DemandScience-Platform-Using-SAML-2-0
- id: oauth2
  conforms: unknown
  evidence: >-
    OAuth 2.0 endpoints appear only as inputs the customer supplies for their own
    IdP. No OAuth 2.0 authorization server is published for the API, and
    /.well-known/oauth-authorization-server returns 401 on api.terminusplatform.com.
- id: rfc9116-security-txt
  conforms: false
  evidence: '/.well-known/security.txt returns 404 on demandscience.com and terminus.bound360.com, 401 on api.terminusplatform.com.'
- id: rfc8615-well-known
  conforms: false
  evidence: No .well-known document was recoverable on any host. See well-known/terminus-well-known.yml.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Determined 2026-08-12 from the Verify API "Error Handling" article, which
    publishes the error envelope verbatim. The media type is application/json (not
    application/problem+json) and the members are httpStatus / code / timeStamp /
    codeName / exceptionName / message — none of which is an RFC 9457 member
    (type / title / status / detail / instance). A second, different error shape
    ({"message":"Forbidden"}) is returned by the AWS API Gateway edge. The Terminus
    ABM Platform API remains unobservable: anonymous requests return a plain-text
    401 body ("Authentication Invalid").
  source: https://support.demandscience.com/hc/en-us/articles/38485976880147-Error-Handling
- id: http-status-codes
  conforms: true
  evidence: >-
    "The Verify API uses standard HTTP status codes to indicate the result of each
    request: 4xx - Client Errors ... 5xx - Server Errors", and the published sample
    error carries both a symbolic httpStatus (BAD_REQUEST) and the numeric code 400.
    Confirmed live: an anonymous POST returns 403.
  source: https://support.demandscience.com/hc/en-us/articles/38485976880147-Error-Handling
- id: rfc6750-bearer-token
  conforms: false
  evidence: 'No documented API uses a Bearer token. The only published header scheme is the custom `x-api-key` header on the Verify API.'
- id: rfc8594-sunset-header
  conforms: unknown
  evidence: 'Product retirements are announced as dated help-center articles (see lifecycle/terminus-lifecycle.yml). No Sunset or Deprecation response header is documented, and none is observable without credentials.'
- id: webhooks
  conforms: false
  evidence: 'No webhook or callback surface is documented for any product. A help-center search for "webhook" returns 0 articles; the Verify API''s asynchronous batch flow is completion-by-polling only.'
  source: https://support.demandscience.com/api/v2/help_center/articles/search.json?query=webhook
- id: asyncapi
  conforms: false
  evidence: 'No AsyncAPI document and no event/streaming surface is published on any host.'
- id: a2a-agent-card
  conforms: false
  evidence: '/.well-known/agent-card.json and /.well-known/agent.json miss on every host (401 / 404 / SPA HTML catch-all).'
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document at any probed location on api.terminusplatform.com,
    email.terminusplatform.com, terminus.bound360.com, app.demandscienceplatform.com,
    or developer.terminus.com. The Redocly portal that renders the reference is
    entirely behind a login. Re-checked 2026-08-12 and extended to the newly found
    Verify API host: api.lastbounce.com returns HTTP 403
    {"message":"Missing Authentication Token"} on /openapi.json, /openapi.yaml,
