    app.demandscienceplatform.com, and support.terminus.com redirects to
    support.demandscience.com. Terminus-branded infrastructure remains in production:
    api.terminusplatform.com, email.terminusplatform.com (Email Experiences /
    Signature Ads), terminus.bound360.com (Web Experiences), *.terminus.services.
