  docs: https://support.demandscience.com/hc/en-us/articles/360051822454-Employee-Automation-API-for-Email-Experiences
  note: >-
    The only publicly stated API version anywhere on the Terminus / DemandScience
    surface is the Employee Automation API v4. No versioning policy, no version
    header, and no dated version train is published. The ABM Platform API reference
    is behind the developer.terminus.com login, so its versioning scheme is not
    publicly observable.
    UPDATED 2026-08-12: the Verify API (api.lastbounce.com), documented publicly in
    the help center, carries NO version segment in any of its paths
    (/api/singleEmail/validate, /api/batch/validation, /api/batch/{jobId}/status,
    /api/file/download/{jobId}) and no version header is documented — so it has no
    versioning scheme at all, which is a distinct finding from "undisclosed".
